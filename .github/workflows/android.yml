name: Android APK

# Native Android app (D4): a sideloadable, debug-signed APK built from the crate's
# cdylib + `android_main` via cargo-apk. Downloadable as a workflow artifact (and a
# Release asset on v* tags). Built blind in CI — the human installs + verifies on a phone.
#
# Runs on src/Cargo changes to main (so the build is exercised as the code evolves),
# on demand, and on tags. Tighten to dispatch+tags once it's reliably green.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
    tags: ['v*']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to Releases on tags

jobs:
  apk:
    name: build arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK (debug-signed, sideloadable)
        # cargo-apk auto-generates a debug keystore and signs with it — no key
        # ceremony, sideloadable. (`--release` would demand a configured release
        # keystore; a release-signed, optimised APK is the perf follow-up.)
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo apk build --lib

      - name: Align, re-sign (v1+v2+v3) + stage the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          # Prefer cargo-apk's final output under */apk/, else any apk.
          apk="$(find target -path '*/apk/*.apk' | head -n1 || true)"
          [ -z "$apk" ] && apk="$(find target -name '*.apk' | head -n1 || true)"
          if [ -z "$apk" ]; then echo "no APK produced"; exit 1; fi
          echo "cargo-apk produced: $apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          # cargo-apk's debug APK can be rejected by modern Android as an "invalid
          # package" (no zipalign / only a v1 signature). zipalign + apksigner re-sign
          # (v1+v2+v3) with a debug keystore makes it installable.
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$apk" aligned.apk
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out dist/brickmap-android-arm64.apk aligned.apk
          "$BT/apksigner" verify --verbose dist/brickmap-android-arm64.apk
          ls -la dist/brickmap-android-arm64.apk

      - name: Upload artifact (also downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: brickmap-android-arm64
          path: dist/brickmap-android-arm64.apk
          if-no-files-found: error

      # Publish to a rolling "dev" prerelease so there's a *direct, phone-friendly*
      # download link (release assets on a public repo need no login and aren't zipped,
      # unlike workflow artifacts). Updated in place on every main build.
      - name: Publish to the rolling 'dev' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev builds (latest main)
          prerelease: true
          files: dist/brickmap-android-arm64.apk
          body: |
            Auto-built from the latest `main`. **Android:** debug-signed APK —
            enable "install from unknown sources" and tap to install. (A faster
            release-signed build is coming; desktop binaries land here too.)
