name: Android APK

# Native Android app (D4): a sideloadable, debug-signed APK built from the crate's
# cdylib + `android_main` via cargo-apk. Downloadable as a workflow artifact (and a
# Release asset on v* tags). Built blind in CI — the human installs + verifies on a phone.
#
# Runs on src/Cargo changes to main (so the build is exercised as the code evolves),
# on demand, and on tags. Tighten to dispatch+tags once it's reliably green.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
    tags: ['v*']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to Releases on tags

jobs:
  apk:
    name: build arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK (release, optimised)
        # Release profile → optimised native code (the debug APK ran far too slow).
        # Signed via the committed release.keystore (see the crate's Cargo.toml
        # signing.release). Run from the crate dir so cargo-apk reads its manifest +
        # `[package.metadata.android]` and resolves the keystore path; the build still
        # outputs to the shared workspace `target/` at the repo root.
        working-directory: crates/brickmap
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo apk build --release --lib

      - name: Align, re-sign (v1+v2+v3) + stage the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          # Prefer cargo-apk's final output under */apk/, else any apk.
          apk="$(find target -path '*/apk/*.apk' | head -n1 || true)"
          [ -z "$apk" ] && apk="$(find target -name '*.apk' | head -n1 || true)"
          if [ -z "$apk" ]; then echo "no APK produced"; exit 1; fi
          echo "cargo-apk produced: $apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          # zipalign + apksigner re-sign (v1+v2+v3) with the committed sideload key, so
          # the APK installs on modern Android and successive builds update in place.
          # The filename carries the short SHA so you can tell builds apart (and aren't
          # served a cached old one).
          sha="$(git rev-parse --short HEAD)"
          out="brickmap-${sha}-android-arm64.apk"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$apk" aligned.apk
          "$BT/apksigner" sign \
            --ks crates/brickmap/release.keystore --ks-pass pass:brickmap \
            --ks-key-alias brickmap --key-pass pass:brickmap \
            --out "dist/$out" aligned.apk
          "$BT/apksigner" verify --verbose "dist/$out"
          ls -la "dist/$out"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (also downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      # Keep the rolling `dev` release tidy: drop the previous APK(s) before adding the
      # new SHA-named one, so the Releases page shows exactly one current APK.
      - name: Prune old APKs from the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          rel="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repo/releases/tags/dev" || true)"
          ids="$(printf '%s' "$rel" | jq -r '.assets[]? | select(.name|endswith(".apk")) | .id' 2>/dev/null || true)"
          for id in $ids; do
            echo "deleting old asset $id"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/assets/$id" || true
          done

      # Publish to a rolling "dev" prerelease so there's a *direct, phone-friendly*
      # download link (release assets on a public repo need no login and aren't zipped,
      # unlike workflow artifacts). The SHA-named asset makes new builds obvious.
      - name: Publish to the rolling 'dev' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: brickmap dev — ${{ steps.apk.outputs.sha }}
          prerelease: true
          files: dist/${{ steps.apk.outputs.name }}
          body: |
            Auto-built from `main` @ `${{ steps.apk.outputs.sha }}`. **Android:** sideloadable
            release APK — enable "install from unknown sources" and tap to install. Updates
            in place (stable signing key). The filename + release title carry the build SHA;
            the in-app HUD shows it too.
