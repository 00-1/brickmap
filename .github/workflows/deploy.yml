name: Deploy preview

# Builds the WASM app and publishes it to GitHub Pages so the latest `main` is
# always previewable. See docs/development.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish (don't cancel a
# publish midway).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WASM bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Use the exact wasm-bindgen-cli version from Cargo.lock so the generated JS
      # glue matches the compiled wasm (mismatches cause subtle runtime breakage).
      - name: Resolve wasm-bindgen version
        id: wb
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep '^version' | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli ${{ steps.wb.outputs.version }}
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Build (release)
        run: cargo build -p scraped-again --release --lib --target wasm32-unknown-unknown

      - name: Assemble site
        run: |
          rm -rf dist && mkdir -p dist/latest
          # Build gallery (root) + the latest app (/latest/) + frozen snapshots.
          cp web/gallery/index.html dist/index.html
          cp web/index.html dist/latest/index.html
          # Cache-bust the latest app's unhashed bundle with the commit SHA, and
          # stamp a short build id on the page.
          build_epoch=$(date -u +%s)
          sed -i "s/__CACHE_BUST__/${GITHUB_SHA}/g; s/__BUILD_SHA__/${GITHUB_SHA:0:7}/g; s/__BUILD_TIME__/${build_epoch}/g" dist/latest/index.html
          # Version sentinel: fetched uncached by the page to self-heal a stale
          # cached index.html (see web/index.html). Full SHA, must match the baked one.
          printf '{"sha":"%s"}' "${GITHUB_SHA}" > dist/latest/version.json
          wasm-bindgen --target web --no-typescript \
            --out-dir dist/latest/pkg \
            target/wasm32-unknown-unknown/release/scraped_again.wasm
          # Immutable milestone snapshots, committed under web/archive/.
          if [ -d web/archive ]; then cp -r web/archive dist/archive; fi
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
