name: CI

on:
  push:
  pull_request:

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test + wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + clippy/rustfmt + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Linux build deps (gilrs → libudev; cpal → libasound2)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      # M9: the engine/game boundary is enforced by the crate graph — no engine crate
      # (bm-* or the brickmap facade) may depend on the game. Assert it mechanically.
      - name: Engine/game boundary (no engine crate depends on the game)
        run: |
          set -euo pipefail
          fail=0
          for c in bm-core bm-world bm-mesh bm-scene bm-render bm-platform brickmap; do
            if cargo tree -p "$c" -e normal,build --prefix none | grep -qx 'scraped-again v[0-9].*'; then
              echo "BOUNDARY VIOLATION: engine crate '$c' depends on the game crate 'scraped-again'"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK: no engine crate depends on the game."

      - name: Engine renders with zero game content (demo builds against bm-* only)
        run: cargo build -p brickmap --example engine_demo

      - name: Web target still builds (the game cdylib is what Pages ships)
        run: cargo build -p scraped-again --lib --target wasm32-unknown-unknown
