name: Desktop builds

# Native desktop binaries (D8): Windows .exe + Linux binary you download and run.
# Built on src/Cargo changes to main, published as SHA-named assets on the rolling `dev`
# GitHub Release (same scheme as the Android APK, so you can tell builds apart) + as
# downloadable workflow artifacts. Also on demand + on version tags.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop.yml'
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create/attach Releases on tags

jobs:
  build:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            src: scraped-again
            key: linux-x86_64
          - os: windows-latest
            src: scraped-again.exe
            key: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Linux build deps (gilrs → libudev; cpal → libasound2)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev

      - name: Build (release)
        run: cargo build --release --bin scraped-again

      - name: Stage binary (SHA-named, like the Android APK)
        id: bin
        shell: bash
        run: |
          sha="$(git rev-parse --short HEAD)"
          out="scraped-again-${sha}-${{ matrix.key }}"
          mkdir -p dist
          cp "target/release/${{ matrix.src }}" "dist/$out"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "platform=${{ matrix.key }}" | sed 's/\.exe$//' >> "$GITHUB_OUTPUT"

      - name: Upload artifact (downloadable from this run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bin.outputs.name }}
          path: dist/${{ steps.bin.outputs.name }}
          if-no-files-found: error

      # Drop this platform's previous binary from the rolling `dev` release before adding
      # the new SHA-named one (matches each `*-<platform>` asset; leaves the APK + the
      # other OS alone). Per-platform pattern so the two matrix jobs don't race.
      - name: Prune old ${{ steps.bin.outputs.platform }} binaries from the dev release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          plat="${{ steps.bin.outputs.platform }}"
          rel="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repo/releases/tags/dev" || true)"
          ids="$(printf '%s' "$rel" | jq -r --arg p "$plat" \
            '.assets[]? | select(.name | contains($p)) | .id' 2>/dev/null || true)"
          for id in $ids; do
            echo "deleting old asset $id"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/assets/$id" || true
          done

      - name: Publish to the rolling 'dev' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: brickmap dev — ${{ steps.bin.outputs.sha }}
          prerelease: true
          files: dist/${{ steps.bin.outputs.name }}
