<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>brickmap — spike</title>
    <!-- Self-heal a stale, browser-cached index.html. GitHub Pages serves HTML
         with a short cache lifetime, so a plain reload can keep handing you the
         old page (the wasm is ?v=-busted, but the HTML itself isn't). This runs
         first, fetches the deploy's version sentinel UNCACHED, and if its SHA
         differs from the one baked into this page, reloads through a fresh URL
         (a new ?v= key forces the browser past its HTML cache). A sessionStorage
         guard stops any reload loop. `__CACHE_BUST__` is the full SHA at deploy. -->
    <script>
      (function () {
        var baked = "__CACHE_BUST__";
        // Unreplaced placeholder => opened from source, not a deploy: do nothing.
        if (baked.indexOf("CACHE_BUST") !== -1) return;
        fetch("version.json?_=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (v) {
            if (!v || !v.sha || v.sha === baked) return;
            if (sessionStorage.getItem("brickmap-reloaded") === v.sha) return;
            sessionStorage.setItem("brickmap-reloaded", v.sha);
            location.replace(location.pathname + "?v=" + v.sha);
          })
          .catch(function () { /* offline / first deploy: ignore */ });
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: #c8d0e0;
        font: 14px/1.4 system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      canvas {
        border: 1px solid #1c2233;
        image-rendering: pixelated;
      }
      /* Perf HUD overlay (M5) — top-left, monospace, set from wasm each frame. */
      #hud {
        position: fixed;
        top: 8px;
        left: 10px;
        font: 12px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: #8affc8;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <canvas id="brickmap-canvas" width="960" height="720"></canvas>
    <p>
      brickmap — auto-flying. <b>Click</b> or <b>WASD</b> to take control
      (<b>drag</b> look, <b>Space/Shift</b> up/down, <b>Esc</b> release),
      <b>F</b> to resume auto-fly. <a href="../">build gallery →</a>
    </p>
    <!-- Live aesthetic dials (D2): drive shader params via wasm setters. -->
    <div
      style="display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; color: #8a93a8; font-size: 12px; margin-top: 8px"
    >
      <label>wobble <input type="range" id="dial-wobble" min="20" max="400" value="85" /></label>
      <label>dither <input type="range" id="dial-steps" min="2" max="16" step="1" value="4" /></label>
    </div>

    <p style="color: #4a5266; font-size: 12px; margin-top: 4px">
      build
      <a style="color: #6c8cff" href="https://github.com/00-1/brickmap/commit/__CACHE_BUST__">__BUILD_SHA__</a>
      <span id="build-age" title=""></span>
    </p>

    <!-- Show how long ago this build was deployed. `__BUILD_TIME__` is replaced with
         the build's UTC epoch seconds at deploy time; the relative label ticks live. -->
    <script>
      (function () {
        var built = "__BUILD_TIME__";
        var el = document.getElementById("build-age");
        if (!el || built.indexOf("BUILD_TIME") !== -1) return; // opened from source
        var t = parseInt(built, 10) * 1000;
        function tick() {
          var s = Math.max(0, (Date.now() - t) / 1000);
          var label;
          if (s < 60) label = "just now";
          else if (s < 3600) label = Math.floor(s / 60) + "m ago";
          else if (s < 86400) label = Math.floor(s / 3600) + "h ago";
          else label = Math.floor(s / 86400) + "d ago";
          el.textContent = "· built " + label;
          el.title = new Date(t).toLocaleString();
        }
        tick();
        setInterval(tick, 30000);
      })();
    </script>

    <!-- The wasm-bindgen bundle (./pkg) is generated by the build; see README. -->
    <!-- `__CACHE_BUST__` is replaced with the commit SHA at deploy time so a new
         build is never served stale from cache (the filenames are unhashed). -->
    <script type="module">
      import init, { set_wobble, set_color_steps } from "./pkg/brickmap.js?v=__CACHE_BUST__";
      init({ module_or_path: "./pkg/brickmap_bg.wasm?v=__CACHE_BUST__" })
        .catch((err) => {
          // winit's web backend escapes its run loop by throwing; that's expected.
          if (!`${err}`.includes("Using exceptions for control flow")) {
            console.error(err);
          }
        })
        .finally(() => {
          const wobble = document.getElementById("dial-wobble");
          const steps = document.getElementById("dial-steps");
          wobble.addEventListener("input", () => set_wobble(parseFloat(wobble.value)));
          steps.addEventListener("input", () => set_color_steps(parseFloat(steps.value)));
        });
    </script>
  </body>
</html>
