[package]
name = "brickmap"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
description = "A high-performance, cross-platform voxel rendering engine (facade over the bm-* crates)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/00-1/brickmap"

# The engine facade is a library only — the game crate owns the binary/cdylib.
[lib]
crate-type = ["rlib"]

[dependencies]
# The engine library crates this facade re-exports (the whole bm-* DAG).
bm-core = { path = "../bm-core" }
bm-world = { path = "../bm-world" }
bm-mesh = { path = "../bm-mesh" }
bm-scene = { path = "../bm-scene" }
bm-render = { path = "../bm-render" }
bm-platform = { path = "../bm-platform" }

# Meshing throughput bench (M2) — exercises the engine mesher through the facade.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "meshing"
harness = false
