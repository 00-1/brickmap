[package]
name = "bm-render"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
description = "brickmap engine: wgpu device/pipelines/passes, splat + post chain, text/hud/map overlays, particles, materials."
license = "MIT OR Apache-2.0"
repository = "https://github.com/00-1/brickmap"

[dependencies]
bm-core = { path = "../bm-core" }
bm-world = { path = "../bm-world" }
bm-mesh = { path = "../bm-mesh" }
bm-scene = { path = "../bm-scene" }
wgpu = "29"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
winit = "0.30"
log = "0.4"
# Tiny public-domain 8x8 bitmap font for the in-engine text/HUD overlays.
font8x8 = "0.3"
# Cross-platform monotonic clock (std::time on native, performance.now on web).
web-time = "1"

# --- Web / WASM-only -----------------------------------------------------
# WebGL2 fallback for browsers without WebGPU (nearly free here; widens reach).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", features = ["webgl"] }

# A hud-overlay test dumps a sample PNG (native only), like the headless tool.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
png = "0.17"
